name: Content suggestion
description: Suggest a new page, section, or improvement to the guide.
title: "[Suggestion]: "
labels: ["suggestion"]
body:
  - type: textarea
    id: suggestion
    attributes:
      label: Your suggestion
      description: What would you like to see added or improved?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why would this help?
      description: How would this make the guide more useful? (Optional)
    validations:
      required: false
